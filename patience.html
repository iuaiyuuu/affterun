<!DOCTYPE html>

            display: block;

        /* Semi-transparent filter overlay */
        .filter {

            left: 0;
            top: 0;
            width: 759px;
            height: 1350px;
            background: rgba(248, 251, 248, 0.26);

        }

            font-style: normal;
            color: #113e5b;
            font-size: 19px;
            line-height: 0.91;

        .divider {
            position: absolute;
            left: 60px;
            top: 541px;
            width: 274px;
            height: 0;
        }

        .divider svg {
            display: block;
            width: 274px;
            height: 3px;
            overflow: visible;
        }

        /* Date frame: 25 DEC 2026 */
        .date-frame {
            position: absolute;
            left: 60px;
            top: 668px;

            align-items: center;
        }

        .date-num-wrapper {
            width: 20.753px;
            height: 38.314px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: visible;

            justify-content: center;

            font-weight: 600;
            font-style: normal;
            color: #113e5b;
            font-size: 23.946px;

            flex-direction: column;

            font-weight: 400;
            font-style: normal;
            color: #113e5b;
            font-size: 19.792px;
            text-align: right;
            line-height: normal;

            left: 653px;

            font-weight: 400;
            font-style: italic;
            color: #113e5b;
            font-size: 15px;
            text-align: right;

        }

        .poster-label p {
            line-height: normal;
            margin-bottom: 0;
        }

        .poster-label p:last-child {
            margin-bottom: 0;
        }

<body>
    <div class="poster">
        <!-- Background -->
        <div class="bg">

        <div class="divider">

        </div>

        <div class="date-frame">

                    <span class="date-num">25</span>

            <span class="date-month">DEC</span>
            <span class="date-year">2026</span>

        <!-- Stats -->
        <div class="stats">
            <p>113.88 KM</p>
            <p>10H 33M</p>
            <p>08:43 AM</p>
        </div>

        <!-- Affterun label -->
        <div class="poster-label">
            <p>Affterun</p>
            <p>Poster 003</p>
