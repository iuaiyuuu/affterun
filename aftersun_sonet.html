<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>After Sun — Poster 001</title>
    <style>
        /* ─── Google Fonts ─── */
        @import url('https://fonts.googleapis.com/css2?family=Reddit+Sans:ital,wght@0,200..900;1,200..900&family=Noto+Sans+Gujarati:wght@100..900&family=Noto+Sans:wght@400;700&display=swap');

        /* ─── Reset ─── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ─── Page wrapper ─── */
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 32px;
            background: #444;
        }

        /* ════════════════════════════════════════
       POSTER  —  1080 × 1350 px
    ════════════════════════════════════════ */
        .poster {
            position: relative;
            width: 1080px;
            height: 1350px;
            overflow: hidden;
            flex-shrink: 0;

            /* background: noise texture (top-left, 1024×1024) + white gradient */
            background-image:
                url('src/imports/AfterSunDesign/375fdfbef4ae267725c718ad778a9c2aefa26e60.png'),
                linear-gradient(90deg, rgb(255, 255, 255) 0%, rgb(255, 255, 255) 100%);
            background-size: 1024px 1024px, auto auto;
            background-position: top left, top left;
            background-repeat: no-repeat, repeat;
        }

        /* ─── FRAME_IMAGE  (left photo panel, 680 px wide) ─── */
        .frame-image {
            position: absolute;
            width: 680px;
            height: 1350px;
            left: 0;
            top: 0;
            overflow: hidden;
        }

        /* inner image container shifted left so it's centered */
        .image-bg {
            position: absolute;
            width: 955px;
            height: 1350px;
            left: -273px;
            top: 0;
        }

        .image-bg img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            max-width: none;
        }

        /* ─── Right panel  (#f2f0f1, 400 px) ─── */
        .right-panel {
            position: absolute;
            left: 680px;
            top: 0;
            width: 400px;
            height: 1350px;
            background: #f2f0f1;
        }

        /* ─── Title "after sun." ─── */
        .title {
            position: absolute;
            left: 205px;
            top: 33px;
            white-space: nowrap;
            font-family: 'Noto Sans Gujarati', 'Noto Sans', sans-serif;
            font-weight: 700;
            font-size: 178px;
            line-height: normal;
            color: #f6b50b;
            font-variation-settings: 'CTGR' 0, 'wdth' 100, 'wght' 700;
        }

        /* ─── Frame1: time + date + name ─── */
        /*
      Tailwind source:
        -translate-x-1/2
        absolute
        bottom-[982px]
        left-[calc(50%+317.5px)]
        w-[303px]  h-[97px]
        flex flex-wrap gap-[0px_5px]
        justify-end  items-start
        text-[25px] text-black leading-[normal]
    */
        .frame1 {
            position: absolute;
            width: 303px;
            height: 97px;
            left: calc(50% + 317.5px);
            bottom: 982px;
            transform: translateX(-50%);

            display: flex;
            flex-wrap: wrap;
            gap: 0 5px;
            justify-content: flex-end;
            align-items: flex-start;
            align-content: flex-start;

            font-size: 25px;
            color: black;
            line-height: normal;
        }

        .frame1-time,
        .frame1-date {
            font-family: 'Reddit Sans', sans-serif;
            font-weight: 400;
            font-style: italic;
            white-space: nowrap;
            flex-shrink: 0;
            position: relative;
        }

        .frame1-name {
            font-family: 'Reddit Sans', sans-serif;
            font-weight: 700;
            font-style: normal;
            width: 303px;
            height: 65px;
            text-align: right;
            flex-shrink: 0;
            position: relative;
        }

        /* ─── Frame: stats  (distance / time) ─── */
        /*
      Tailwind source:
        -translate-y-1/2
        absolute
        right-[71px]
        top-[calc(50%+522px)]
        w-[291px]
        flex gap-[12px] items-center justify-end
        font-bold text-[25px] text-black leading-[normal] whitespace-nowrap
    */
        .frame-stats {
            position: absolute;
            width: 291px;
            right: 71px;
            top: calc(50% + 522px);
            transform: translateY(-50%);

            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: flex-end;

            font-family: 'Reddit Sans', sans-serif;
            font-weight: 700;
            font-style: normal;
            font-size: 25px;
            color: black;
            line-height: normal;
            white-space: nowrap;
        }

        .frame-stats p {
            flex-shrink: 0;
            position: relative;
        }

        /* ─── Description paragraph ─── */
        /*
      Tailwind source:
        -translate-x-full
        absolute
        left-[1009px]
        top-[1042px]
        w-[303px]  h-[143px]
        font-italic text-[21px] text-black leading-[normal] text-right
    */
        .description {
            position: absolute;
            width: 303px;
            height: 143px;
            left: 1009px;
            top: 1042px;
            transform: translateX(-100%);

            font-family: 'Reddit Sans', sans-serif;
            font-weight: 400;
            font-style: italic;
            font-size: 21px;
            color: black;
            line-height: normal;
            text-align: right;
        }

        /* ─── Footer: "Affterun / Poster 001" ─── */
        /*
      Tailwind source:
        -translate-x-full
        absolute
        left-[1009px]
        top-[1222px]
        leading-[0]
        font-italic text-[15px] text-black text-right whitespace-nowrap
    */
        .footer {
            position: absolute;
            left: 1009px;
            top: 1222px;
            transform: translateX(-100%);

            font-family: 'Reddit Sans', sans-serif;
            font-weight: 400;
            font-style: italic;
            font-size: 15px;
            color: black;
            text-align: right;
            white-space: nowrap;
            line-height: 0;
        }

        .footer p {
            line-height: normal;
            margin-bottom: 0;
        }

        /* ─── Noise overlay ─── */
        /*
      Tailwind source:
        absolute
        left-[-150px]  top-[-15px]
        size-[1380px]
        opacity-17   (= 17%)
    */
        .noise-bg {
            position: absolute;
            left: -150px;
            top: -15px;
            width: 1380px;
            height: 1380px;
            opacity: 0.17;
        }

        .noise-bg img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            max-width: none;
        }
    </style>
</head>

<body>

    <!-- ══════════════════════════════════════════
       POSTER  1080 × 1350 px
  ══════════════════════════════════════════ -->
    <div class="poster" data-name="after_sun_design">

        <!-- Left photo panel -->
        <div class="frame-image" data-name="FRAME_IMAGE">
            <div class="image-bg" data-name="image_bg">
                <img alt="" src="src/imports/AfterSunDesign/a173472aa5e6d70351d310f4cc3994c0a2e9c97c.png" />
            </div>
        </div>

        <!-- Right matte panel (#f2f0f1) -->
        <div class="right-panel"></div>

        <!-- "after sun." heading -->
        <p class="title">after sun.</p>

        <!-- Time · Date · Athlete name -->
        <div class="frame1">
            <p class="frame1-time">08:31 AM</p>
            <p class="frame1-date">2026/05/13</p>
            <p class="frame1-name">Abiyyu Rahman</p>
        </div>

        <!-- Distance / Duration -->
        <div class="frame-stats">
            <p>113.88 km</p>
            <p>/</p>
            <p>130m 8s</p>
        </div>

        <!-- Run description -->
        <p class="description">
            No records were broken today. Just a few kilometers spent breathing
            slowly, clearing small thoughts, and letting the body move without
            pressure.
        </p>

        <!-- Footer label -->
        <div class="footer">
            <p>Affterun</p>
            <p>Poster 001</p>
        </div>

        <!-- Noise texture overlay (opacity 17 %) -->
        <div class="noise-bg" data-name="noise_bg">
            <img alt="" src="src/imports/AfterSunDesign/375fdfbef4ae267725c718ad778a9c2aefa26e60.png" />
        </div>

    </div><!-- /.poster -->

</body>

</html>
