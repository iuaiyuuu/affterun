    <title>Retro Poster – Affterun 002</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* ── Reset ─────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── Page ──────────────────────────────────── */
        body {
            background: #1c1c1c;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .poster-wrapper {
            transform-origin: top center;
            /* JS will set scale on small screens */
        }

        /* ── Poster canvas ─────────────────────────── */
        .poster {
            position: relative;
            width: 911px;
            height: 1350px;
            background: #e3dfdc;
            overflow: hidden;
        }

        /* ── Main photo (below RETRO text) ─────────── */
        .bg-photo {
            position: absolute;
            left: 16px;
            top: 754px;
            width: 880px;
            height: 581px;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-photo img {
            position: absolute;
            width: 100%;
            height: 200.57%;
            top: -100.57%;
            left: 0;
            max-width: none;
        }

        /* ── Photo masked through RETRO letters ────── */
        .retro-masked {
            position: absolute;
            left: 16px;
            top: 567px;
            width: 880px;
            height: 768px;
            mask: url(#retro-text-mask);
            -webkit-mask: url(#retro-text-mask);
            overflow: hidden;
            pointer-events: none;
        }

        .retro-masked img {
            position: absolute;
            width: 100%;
            height: 151.74%;
            top: -51.74%;
            left: 0;
            max-width: none;
        }

        /* ── Noise texture overlay ─────────────────── */
        .noise-overlay {
            position: absolute;
            left: -150px;
            top: -15px;
            width: 1380px;
            height: 1380px;
            opacity: 0.24;
            pointer-events: none;
        }

        .noise-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── Stats typography ──────────────────────── */
        .stat-label {
            position: absolute;
            font-family: 'Reddit Sans', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: #000;
            line-height: normal;
        }

        .stat-value {
            position: absolute;
            font-family: 'Reddit Sans', sans-serif;
            font-weight: 400;
            font-size: 25px;
            color: #000;
            line-height: normal;
        }

        /* ── Corner "+" marks ──────────────────────── */
        .corner-plus {
            position: absolute;
            font-family: 'Kaisei HarunoUmi', serif;
            font-style: normal;
            font-size: 139px;
            color: #000;
            opacity: 0.5;
            line-height: normal;
            top: -56px;
        }

        /* ── Quote ─────────────────────────────────── */
        .quote-text {
            position: absolute;
            font-family: 'Racing Sans One', cursive;
            font-style: normal;
            font-size: 19px;
            color: #F8F8F4;
            white-space: nowrap;
            left: 228px;
            top: 1219px;
        }

        /* ── Barcode ───────────────────────────────── */
        .barcode {
            position: absolute;
            left: 349px;
            top: 1247px;
            width: 213px;
            height: 74px;
            overflow: hidden;
        }

        .barcode img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── Credit text ───────────────────────────── */
        /*
      Original: left:873px + translateX(-100%)
      → right edge aligns at x=873px
      → equivalent to right: 911-873 = 38px
    */
        .credit-text {
            position: absolute;
            right: 38px;
            top: 1284px;
            font-family: 'Reddit Sans', sans-serif;
            font-weight: 400;
            font-style: italic;
            font-size: 15px;
            color: #000;
            text-align: right;
            white-space: nowrap;
            line-height: normal;
        }
    </style>
</head>

    <!-- ── Poster ──────────────────────────────── -->
    <div class="poster-wrapper">
        <div class="poster">

            <!-- Main photo (lower section) -->
            <div class="bg-photo">
                <img src="./src/imports/Retro/838e9db895bd7414becd037b1c776379795976b3.png" alt="">
            </div>

            <!-- Photo visible through RETRO letter cutouts -->
            <div class="retro-masked">
                <img src="./src/imports/Retro/838e9db895bd7414becd037b1c776379795976b3.png" alt="">
            </div>

            <!-- ── Stats labels ── top: calc(50% of 1350) - 162 = 513px -->
            <p class="stat-label" style="left:16px; top:513px; width:119px;">Distance -</p>
            <p class="stat-label" style="left:173px; top:513px; width:93px;">Time -</p>
            <p class="stat-label" style="left:291px; top:513px; width:106px;">Moving -</p>
            <p class="stat-label" style="left:432px; top:513px; width:93px;">Date -</p>

            <!-- ── Stats values ── top: calc(50% of 1350) - 130 = 545px -->
            <p class="stat-value" style="left:16px; top:545px; width:155px;">113.88 km</p>
            <p class="stat-value" style="left:173px; top:545px; width:155px;">08:33 AM</p>
            <p class="stat-value" style="left:291px; top:545px; white-space:nowrap;">130m 8s</p>
            <p class="stat-value" style="left:432px; top:545px;">2026/05/13</p>

            <!-- Corner registration marks -->
            <p class="corner-plus" style="left:0;">+</p>
            <p class="corner-plus" style="left:806px;">+</p>

            <!-- Noise / grain texture overlay -->
            <div class="noise-overlay">
                <img src="./src/imports/Retro/375fdfbef4ae267725c718ad778a9c2aefa26e60.png" alt="">
            </div>

            <!-- Quote -->
            <p class="quote-text">Some days only make sense after moving for a while.</p>

            <!-- Barcode -->
            <div class="barcode">
                <img src="./src/imports/Retro/1dce5bffb1d84ccb5999b165155d0ddbedb9496c.png" alt="">
            </div>

            <!-- Credit label (right-aligned, right edge at x=873px) -->
            <div class="credit-text">
                <p>Affterun</p>
                <p>Poster 002</p>
            </div>

        </div><!-- /.poster -->
    </div><!-- /.poster-wrapper -->

    <script>
        /**
         * Scale the poster down proportionally on smaller viewports
         * so it always fits without horizontal scrolling.
         */
        (function () {
            var POSTER_W = 911;
            var wrapper = document.querySelector('.poster-wrapper');

            function scale() {
                var available = window.innerWidth - 40; // account for body padding
                if (available < POSTER_W) {
                    var s = available / POSTER_W;
                    wrapper.style.transform = 'scale(' + s + ')';
                    wrapper.style.transformOrigin = 'top center';
                    // collapse the white-space created below the scaled poster
                    wrapper.style.marginBottom = ((1350 * s) - 1350) + 'px';
                } else {
                    wrapper.style.transform = '';
                    wrapper.style.marginBottom = '';
                }
            }

            window.addEventListener('resize', scale);
            scale();
        })();
    </script>
